# Surveillance du trafic qui atteint Vercel.
#
# Le plan Hobby de Vercel n'offre aucune alerte d'usage, et un dépassement de
# quota suspend le site pendant 30 jours. Cloudflare voit passer tout le trafic :
# ce contrôle lui demande chaque jour combien de requêtes il a transmises à
# l'origine (Vercel) sur les dernières 24 h, et ÉCHOUE au-delà du seuil.
# GitHub envoie alors un e-mail d'échec de workflow : c'est l'alerte.
#
# Repère : quota Vercel = 1 000 000 edge requests / mois, soit ~33 000 / jour.
# Le seuil par défaut (15 000) prévient quand le rythme atteint ~45 % du quota.
#
# Secrets requis (Settings > Secrets and variables > Actions) :
#   CLOUDFLARE_API_TOKEN  jeton en lecture seule (Zone > Analytics > Read)
#   CLOUDFLARE_ZONE_ID    identifiant de la zone lynq-css.com
name: Surveillance du trafic

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      threshold:
        description: "Seuil d'alerte (requêtes transmises à Vercel sur 24 h)"
        required: false
        default: "15000"

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compter les requêtes transmises à Vercel (24 h)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          THRESHOLD: ${{ github.event.inputs.threshold || '15000' }}
        run: |
          set -euo pipefail
          if [ -z "${CF_TOKEN}" ] || [ -z "${CF_ZONE}" ]; then
            echo "::error::Secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ZONE_ID manquants."
            exit 1
          fi

          UNTIL=$(date -u +%Y-%m-%dT%H:00:00Z)
          SINCE=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:00:00Z)

          QUERY='query($zone: String!, $since: Time!, $until: Time!) {
            viewer { zones(filter: {zoneTag: $zone}) {
              httpRequestsAdaptiveGroups(
                limit: 100,
                filter: {datetime_geq: $since, datetime_lt: $until, requestSource: "eyeball"}
              ) { count dimensions { cacheStatus } }
            } }
          }'

          BODY=$(jq -n --arg q "$QUERY" --arg zone "$CF_ZONE" --arg since "$SINCE" --arg until "$UNTIL" \
            '{query: $q, variables: {zone: $zone, since: $since, until: $until}}')

          RESPONSE=$(curl -sS --fail-with-body https://api.cloudflare.com/client/v4/graphql \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$BODY")

          if [ "$(echo "$RESPONSE" | jq '.errors | length // 0')" != "0" ]; then
            echo "::error::Erreur de l'API Cloudflare : $(echo "$RESPONSE" | jq -c '.errors')"
            exit 1
          fi

          ROWS=$(echo "$RESPONSE" | jq '.data.viewer.zones[0].httpRequestsAdaptiveGroups')
          if [ "$ROWS" = "null" ]; then
            echo "::error::Zone introuvable : vérifier CLOUDFLARE_ZONE_ID et les droits du jeton."
            exit 1
          fi

          echo "Requêtes par statut de cache, de ${SINCE} à ${UNTIL} :"
          echo "$ROWS" | jq -r 'sort_by(-.count)[] | "  \(.dimensions.cacheStatus): \(.count)"'

          # Statuts pour lesquels Cloudflare a réellement contacté l'origine.
          # "hit" et "stale" sont servis depuis le cache ; "none"/"unknown"
          # correspondent aux requêtes bloquées ou traitées par Cloudflare seul.
          TOTAL=$(echo "$ROWS" | jq '[.[].count] | add // 0')
          ORIGIN=$(echo "$ROWS" | jq '[.[] | select(.dimensions.cacheStatus
            | IN("miss", "dynamic", "expired", "revalidated", "bypass", "updating")) | .count] | add // 0')

          {
            echo "### Trafic lynq-css.com sur 24 h"
            echo ""
            echo "| Mesure | Requêtes |"
            echo "|---|---|"
            echo "| Reçues par Cloudflare | ${TOTAL} |"
            echo "| Transmises à Vercel | ${ORIGIN} |"
            echo "| Seuil d'alerte | ${THRESHOLD} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Total reçu : ${TOTAL} — transmis à Vercel : ${ORIGIN} — seuil : ${THRESHOLD}"

          if [ "$ORIGIN" -gt "$THRESHOLD" ]; then
            echo "::error::ALERTE : ${ORIGIN} requêtes ont atteint Vercel en 24 h (seuil ${THRESHOLD}). Ouvrir Cloudflare > Security et activer Under Attack Mode si le trafic est anormal."
            exit 1
          fi

      # Qui consomme ? Affiché à chaque exécution, alerte ou non, pour qu'une
      # alerte dise tout de suite d'où vient le trafic (robot, chemin, réseau).
      - name: Détail du trafic (24 h)
        if: always()
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -uo pipefail
          UNTIL=$(date -u +%Y-%m-%dT%H:00:00Z)
          SINCE=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:00:00Z)

          breakdown() {
            local title="$1" dims="$2" order="$3" limit="$4"
            local query="query(\$zone: String!, \$since: Time!, \$until: Time!) {
              viewer { zones(filter: {zoneTag: \$zone}) {
                httpRequestsAdaptiveGroups(
                  limit: ${limit}, orderBy: [${order}],
                  filter: {datetime_geq: \$since, datetime_lt: \$until, requestSource: \"eyeball\"}
                ) { count dimensions { ${dims} } }
              } }
            }"
            local body response
            body=$(jq -n --arg q "$query" --arg zone "$CF_ZONE" --arg since "$SINCE" --arg until "$UNTIL" \
              '{query: $q, variables: {zone: $zone, since: $since, until: $until}}')
            response=$(curl -sS https://api.cloudflare.com/client/v4/graphql \
              -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" --data "$body")
            echo ""
            echo "== ${title}"
            if [ "$(echo "$response" | jq '.errors | length // 0')" != "0" ]; then
              echo "  (indisponible : $(echo "$response" | jq -c '.errors[0].message'))"
              return 0
            fi
            echo "$response" | jq -r '.data.viewer.zones[0].httpRequestsAdaptiveGroups[]
              | "  \(.count)\t\(.dimensions | to_entries | map(.value | tostring) | join(" | "))"'
          }

          breakdown "Par heure (UTC)" "datetimeHour" "datetimeHour_ASC" 30
          breakdown "Par code de réponse" "edgeResponseStatus" "count_DESC" 15
          breakdown "Par robot / navigateur" "userAgent" "count_DESC" 20
          breakdown "Par réseau" "clientASNDescription" "count_DESC" 15
          breakdown "Par pays" "clientCountryName" "count_DESC" 10
          breakdown "Par chemin" "clientRequestPath" "count_DESC" 25
          breakdown "Par statut de cache et code" "cacheStatus edgeResponseStatus" "count_DESC" 20
